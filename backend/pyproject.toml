[project]
name = "frame-vault-engine"
version = "0.0.1"
description = "Local analytics worker for Frame Vault"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = ["numpy>=2.2,<3", "pandas>=2.2,<4", "pydantic>=2.10,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "mypy>=1.14,<2", "pyinstaller>=6.12,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frame_vault_engine"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
