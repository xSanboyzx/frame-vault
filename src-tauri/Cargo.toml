[package]
name = "frame-vault"
version = "0.0.1"
description = "Frame Vault desktop application"
authors = ["Sanhith"]
license = "MIT"
edition = "2021"
rust-version = "1.91.1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "process", "sync", "time", "rt", "macros"] }
log = "0.4"
tauri-plugin-log = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
